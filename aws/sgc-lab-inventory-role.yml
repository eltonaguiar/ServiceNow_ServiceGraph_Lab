AWSTemplateFormatVersion: 2010-09-09
Description: >-
  CUSTOM LAB DERIVATIVE (not an official ServiceNow template) of
  CreateSnowOrganizationAccountAccessRoleInMemberAccount.yml (SG-AWS bundle 2.13).
  Creates the IAM role SnowOrganizationAccountAccessRole (connector STS role, NOT an
  EC2/SSM instance profile) in THIS account, trusted only by the named IAM user in
  this same account. Inventory read permissions only: SendCommand, S3 and
  access-key rotation statements removed. Standalone behaviour is unverified;
  validate with the ServiceNow Diagnostic Tool.
Metadata:
  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: Service Now User Details
        Parameters:
          - ServiceNowUserName
Parameters:
  ServiceNowUserName:
    Type: String
    Default: servicenow-sgc-lab
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
    ConstraintDescription: IAM user name only (no path), 1-64 chars of A-Z a-z 0-9 +=,.@_-
    Description: Existing IAM user (in this account) used by the ServiceNow connector.
Resources:
  SnowOrganizationAccountAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SnowOrganizationAccountAccessRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${ServiceNowUserName}
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: SnowOrganizationAccountAccessPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: ServiceNowUserReadOnlyAccessOrg
                Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:ListAccounts
                  - organizations:ListRoots
                  - organizations:ListAccountsForParent
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:DescribeOrganizationalUnit
                  - organizations:ListTagsForResource
                Resource: '*'
              - Sid: ServiceNowUserReadOnlyAccessConfig
                Effect: Allow
                Action:
                  - config:ListDiscoveredResources
                  - config:SelectResourceConfig
                  - config:BatchGetResourceConfig
                Resource: '*'
              - Sid: ServiceNowUserReadOnlyAccessConfigAgg
                Effect: Allow
                Action:
                  - config:DescribeConfigurationAggregators
                  - config:SelectAggregateResourceConfig
                  - config:BatchGetAggregateResourceConfig
                Resource: '*'
              - Sid: ServiceNowUserReadOnlyAccessEC2
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                Resource: '*'
              - Sid: ServiceNowUserReadOnlyAccessSSM
                Effect: Allow
                Action:
                  - ssm:DescribeInstanceInformation
                  - ssm:ListInventoryEntries
                  - ssm:GetInventory
                Resource: '*'
              - Sid: ServiceNowUserReadOnlyAccessTag
                Effect: Allow
                Action:
                  - tag:GetResources
                Resource: '*'
Outputs:
  ServiceNowUserRoleARN:
    Description: ARN of SnowOrganizationAccountAccessRole
    Value: !GetAtt SnowOrganizationAccountAccessRole.Arn
  STSRoleNameForServiceNow:
    Description: Enter this name (not the ARN) in the ServiceNow STS Role field
    Value: !Ref SnowOrganizationAccountAccessRole
